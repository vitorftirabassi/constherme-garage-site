<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <!-- Root redirect helper: useful when opening the repo root directly outside the Express route setup. -->
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecionando — Constherme Garage</title>
    <script>/* Fallback JS redirect para navegadores que bloqueiem meta refresh */
        (function(){
            try{ window.location.replace('frontend/index.html'); }catch(e){}
        })();
    </script>
</head>
<body>
    <p>Se não for redirecionado automaticamente, <a href="frontend/index.html">clique aqui para abrir o site</a>.</p>
</body>
</html>
