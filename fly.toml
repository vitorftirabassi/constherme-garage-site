app = "constherme-garage"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  SESSION_SECURE_COOKIE = "true"
  CACHE_TTL_SECONDS = "60"

[[mounts]]
  source = "constherme_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"
